name: Keep Streamlit app awake

# Streamlit Community Cloud sleeps an app after a period of inactivity
# based on real browser traffic (WebSocket sessions), not plain HTTP
# requests. This uses a real headless browser (Playwright) to visit the
# live app on a schedule comfortably under that inactivity window, and to
# click the "wake up" button if the app has already gone to sleep. See
# .github/scripts/keep_streamlit_awake.py for the full explanation.
on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app (and wake it if asleep)
        run: python .github/scripts/keep_streamlit_awake.py
